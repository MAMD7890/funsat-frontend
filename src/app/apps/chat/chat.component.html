<div class="mb-4">
  <h2 class="mb-0">Chat</h2>
  <p class="text-muted-soft mb-0">Vista de demostración — mensajes locales, sin conexión al backend</p>
</div>

<div class="chat-shell surface-card">
  <div class="chat-sidebar">
    <div
      class="chat-contact"
      *ngFor="let c of conversaciones"
      [class.active]="c.id === conversacionActivaId"
      (click)="seleccionar(c)"
    >
      <span class="avatar-circle">{{ c.iniciales }}</span>
      <div class="chat-contact-info">
        <div class="chat-contact-name">{{ c.nombre }}</div>
        <div class="chat-contact-preview">{{ c.ultimoMensaje }}</div>
      </div>
      <span class="badge badge-brand" *ngIf="c.noLeidos > 0">{{ c.noLeidos }}</span>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-panel-header">
      <span class="avatar-circle">{{ conversacionActiva.iniciales }}</span>
      <div class="font-weight-bold">{{ conversacionActiva.nombre }}</div>
    </div>

    <div class="chat-messages">
      <div class="chat-bubble" *ngFor="let m of conversacionActiva.mensajes" [class.mine]="m.autor === 'yo'">
        <div>{{ m.texto }}</div>
        <div class="chat-bubble-hora">{{ m.hora }}</div>
      </div>
    </div>

    <div class="chat-input-row">
      <input
        type="text"
        class="form-control"
        placeholder="Escribe un mensaje..."
        [(ngModel)]="borrador"
        (keyup.enter)="enviar()"
      />
      <button type="button" class="btn btn-brand" (click)="enviar()">
        <i class="fa fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>
