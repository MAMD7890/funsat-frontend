<div class="modal-header">
  <h5 class="modal-title">{{ esEdicion ? 'Editar tipo de motor' : 'Nuevo tipo de motor' }}</h5>
  <button type="button" class="close" (click)="activeModal.dismiss()">
    <span>&times;</span>
  </button>
</div>

<div class="modal-body">
  <div class="alert alert-danger py-2" *ngIf="errorGeneral">{{ errorGeneral }}</div>

  <form [formGroup]="form" novalidate>
    <div class="form-group">
      <label>Nombre *</label>
      <input
        type="text"
        class="form-control"
        formControlName="nombre"
        placeholder="Ej: Gasolina 2T"
        autofocus
        [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched"
      />
      <div class="invalid-feedback d-block" *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-6">
        <label>Orden</label>
        <input type="number" class="form-control" formControlName="orden" />
      </div>
      <div class="form-group col-6 form-check align-self-center mt-4">
        <input type="checkbox" class="form-check-input" id="activo" formControlName="activo" />
        <label class="form-check-label" for="activo">Activo</label>
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button type="button" class="btn btn-brand" [disabled]="guardando" (click)="guardar()">
    {{ guardando ? 'Guardando...' : 'Guardar' }}
  </button>
</div>
