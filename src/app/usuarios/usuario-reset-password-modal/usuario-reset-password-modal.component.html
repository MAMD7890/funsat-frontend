<div class="modal-header">
  <h5 class="modal-title">Resetear contraseña</h5>
  <button type="button" class="close" (click)="activeModal.dismiss()">
    <span>&times;</span>
  </button>
</div>

<div class="modal-body">
  <div class="alert alert-danger py-2" *ngIf="errorGeneral">{{ errorGeneral }}</div>

  <p class="text-muted-soft" style="font-size: .85rem;">
    Nueva contraseña para <strong>{{ usuario.nombre }}</strong> ({{ usuario.username }}).
    Deberá cambiarla en su próximo inicio de sesión.
  </p>

  <form [formGroup]="form" novalidate>
    <div class="form-group mb-0">
      <label for="newPassword">Nueva contraseña *</label>
      <input id="newPassword" type="password" class="form-control" formControlName="newPassword" autofocus
             [class.is-invalid]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched" />
      <div class="invalid-feedback d-block" *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
        Mínimo 8 caracteres.
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button type="button" class="btn btn-brand" [disabled]="guardando" (click)="guardar()">
    {{ guardando ? 'Guardando...' : 'Guardar' }}
  </button>
</div>
