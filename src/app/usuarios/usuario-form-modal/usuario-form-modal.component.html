<div class="modal-header">
  <h5 class="modal-title">{{ esEdicion ? 'Editar usuario' : 'Nuevo usuario' }}</h5>
  <button type="button" class="close" (click)="activeModal.dismiss()">
    <span>&times;</span>
  </button>
</div>

<div class="modal-body">
  <div class="alert alert-danger py-2" *ngIf="errorGeneral">{{ errorGeneral }}</div>

  <form [formGroup]="form" novalidate>
    <div class="form-group">
      <label for="nombre">Nombre *</label>
      <input id="nombre" type="text" class="form-control" formControlName="nombre" autofocus
             [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched" />
      <div class="invalid-feedback d-block" *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label for="username">Usuario *</label>
      <input id="username" type="text" class="form-control" formControlName="username"
             placeholder="letras, números, puntos, guiones"
             [class.is-invalid]="form.get('username')?.invalid && form.get('username')?.touched" />
      <div class="invalid-feedback d-block" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
        3-60 caracteres: letras, números, puntos, guiones o guiones bajos.
      </div>
    </div>

    <div class="form-group">
      <label for="email">Correo</label>
      <input id="email" type="email" class="form-control" formControlName="email"
             placeholder="para recibir el resumen diario de alertas"
             [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched" />
      <div class="invalid-feedback d-block" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
        Ingresa un correo válido.
      </div>
    </div>

    <div class="form-group" *ngIf="!esEdicion">
      <label for="password">Contraseña *</label>
      <input id="password" type="password" class="form-control" formControlName="password"
             [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched" />
      <div class="invalid-feedback d-block" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
        Mínimo 8 caracteres.
      </div>
    </div>

    <div class="form-group mb-0">
      <label for="rol">Rol *</label>
      <select id="rol" class="form-control" formControlName="rol">
        <option *ngFor="let r of roles" [value]="r">{{ rolLabel[r] }}</option>
      </select>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button type="button" class="btn btn-brand" [disabled]="guardando" (click)="guardar()">
    {{ guardando ? 'Guardando...' : 'Guardar' }}
  </button>
</div>
