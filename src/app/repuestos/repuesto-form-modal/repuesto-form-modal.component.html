<div class="modal-header">
  <h5 class="modal-title">{{ esEdicion ? 'Editar repuesto' : 'Nuevo repuesto' }}</h5>
  <button type="button" class="close" (click)="activeModal.dismiss()">
    <span>&times;</span>
  </button>
</div>

<div class="modal-body">
  <div class="alert alert-danger py-2" *ngIf="errorGeneral">{{ errorGeneral }}</div>

  <form [formGroup]="form" novalidate>
    <div class="form-group">
      <label for="nombre">Nombre *</label>
      <input id="nombre" type="text" class="form-control" formControlName="nombre" autofocus
             [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched" />
      <div class="invalid-feedback d-block" *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label for="codigo">Código</label>
      <input id="codigo" type="text" class="form-control" formControlName="codigo" />
    </div>

    <div class="form-row">
      <div class="form-group col-6">
        <label for="costoUnitario">Costo unitario</label>
        <input id="costoUnitario" type="number" min="0" step="0.01" class="form-control" formControlName="costoUnitario" />
      </div>
      <div class="form-group col-6">
        <label for="stockDisponible">Stock disponible</label>
        <input id="stockDisponible" type="number" min="0" step="0.01" class="form-control" formControlName="stockDisponible" />
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button type="button" class="btn btn-brand" [disabled]="guardando" (click)="guardar()">
    {{ guardando ? 'Guardando...' : 'Guardar' }}
  </button>
</div>
