<div class="d-flex align-items-center justify-content-between flex-wrap mb-3">
  <div>
    <h2 class="mb-0">Repuestos</h2>
    <p class="text-muted-soft mb-0">Catálogo de repuestos y stock disponible</p>
  </div>
  <button class="btn btn-brand" (click)="nuevoRepuesto()">
    <i class="fa fa-plus mr-1"></i> Nuevo repuesto
  </button>
</div>

<div class="surface-card p-3">
  <div class="table-responsive">
    <table class="table table-app mb-0">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Código</th>
          <th class="text-right">Costo unitario</th>
          <th class="text-right">Stock</th>
          <th class="text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let repuesto of page?.content">
          <td class="font-weight-bold">{{ repuesto.nombre }}</td>
          <td>{{ repuesto.codigo || '—' }}</td>
          <td class="text-right">{{ repuesto.costoUnitario | cop }}</td>
          <td class="text-right">
            <span class="badge" [class.badge-danger]="repuesto.stockDisponible <= 0" [class.badge-success]="repuesto.stockDisponible > 0">
              {{ repuesto.stockDisponible }}
            </span>
          </td>
          <td class="text-right">
            <div class="table-actions">
              <button class="table-action-btn" (click)="editarRepuesto(repuesto)" title="Editar">
                <i class="fa fa-pen"></i>
              </button>
              <button class="table-action-btn table-action-danger" *ngIf="esAdmin" (click)="eliminarRepuesto(repuesto)" title="Eliminar">
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="empty-state" *ngIf="page && page.empty && !cargando">
      <i class="fa fa-cogs mb-2" style="font-size: 2rem;"></i>
      <p class="mb-0">Todavía no hay repuestos registrados.</p>
    </div>

    <div class="empty-state" *ngIf="cargando">
      <i class="fa fa-spinner fa-spin mb-2" style="font-size: 2rem;"></i>
    </div>
  </div>

  <app-pagination [page]="page" (cambiarPagina)="cargar($event)"></app-pagination>
</div>
