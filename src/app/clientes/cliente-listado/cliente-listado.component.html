<div class="d-flex align-items-center justify-content-between flex-wrap mb-3">
  <div>
    <h2 class="mb-0">Clientes</h2>
    <p class="text-muted-soft mb-0">Clientes dueños de equipos externos en taller</p>
  </div>
  <button class="btn btn-brand" (click)="nuevoCliente()">
    <i class="fa fa-plus mr-1"></i> Nuevo cliente
  </button>
</div>

<div class="surface-card p-3">
  <div class="table-responsive">
    <table class="table table-app mb-0">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Teléfono</th>
          <th>Email</th>
          <th class="text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of page?.content">
          <td class="font-weight-bold">{{ cliente.nombre }}</td>
          <td>
            <span class="badge" [class.badge-info]="cliente.tipo === 'EMPRESA'" [class.badge-secondary]="cliente.tipo === 'NATURAL'">
              {{ tipoLabel[cliente.tipo] }}
            </span>
          </td>
          <td>{{ cliente.telefono || '—' }}</td>
          <td>{{ cliente.email || '—' }}</td>
          <td class="text-right">
            <div class="table-actions">
              <button class="table-action-btn" (click)="editarCliente(cliente)" title="Editar">
                <i class="fa fa-pen"></i>
              </button>
              <button class="table-action-btn table-action-danger" *ngIf="esAdmin" (click)="eliminarCliente(cliente)" title="Eliminar">
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="empty-state" *ngIf="page && page.empty && !cargando">
      <i class="fa fa-address-book mb-2" style="font-size: 2rem;"></i>
      <p class="mb-0">Todavía no hay clientes registrados.</p>
    </div>

    <div class="empty-state" *ngIf="cargando">
      <i class="fa fa-spinner fa-spin mb-2" style="font-size: 2rem;"></i>
    </div>
  </div>

  <app-pagination [page]="page" (cambiarPagina)="cargar($event)"></app-pagination>
</div>
