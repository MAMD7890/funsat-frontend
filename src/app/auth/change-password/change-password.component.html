<div class="login-page">
  <div class="login-form-side" style="flex: 1 1 100%;">
    <div class="login-form-wrap">
      <h3 class="mb-1">Cambiar contraseña</h3>
      <p class="text-muted-soft mb-4" *ngIf="esObligatorio">
        Por seguridad debes cambiar tu contraseña temporal antes de continuar.
      </p>
      <p class="text-muted-soft mb-4" *ngIf="!esObligatorio">
        Actualiza tu contraseña de acceso.
      </p>

      <div class="alert alert-success py-2" *ngIf="exito">Contraseña actualizada correctamente.</div>
      <div class="alert alert-danger py-2" *ngIf="errorGeneral">{{ errorGeneral }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate *ngIf="!exito">
        <div class="form-group">
          <label for="currentPassword">Contraseña actual</label>
          <input id="currentPassword" type="password" class="form-control" formControlName="currentPassword" autocomplete="current-password" />
        </div>

        <div class="form-group">
          <label for="newPassword">Nueva contraseña</label>
          <input id="newPassword" type="password" class="form-control" formControlName="newPassword" autocomplete="new-password" />
          <small class="text-muted-soft">Mínimo 8 caracteres.</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar nueva contraseña</label>
          <input id="confirmPassword" type="password" class="form-control" formControlName="confirmPassword" autocomplete="new-password" />
          <div class="invalid-feedback d-block" *ngIf="form.errors?.['noCoincide'] && form.get('confirmPassword')?.touched">
            Las contraseñas no coinciden.
          </div>
        </div>

        <button type="submit" class="btn btn-brand btn-block" [disabled]="cargando">
          <span *ngIf="!cargando">Actualizar contraseña</span>
          <span *ngIf="cargando">Guardando...</span>
        </button>
      </form>
    </div>
  </div>
</div>
