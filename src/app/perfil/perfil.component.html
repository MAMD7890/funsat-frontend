<div class="mb-4">
  <h2 class="mb-0">Mi perfil</h2>
  <p class="text-muted-soft mb-0">Información de tu cuenta</p>
</div>

<div class="surface-card p-4" style="max-width: 480px;" *ngIf="usuario">
  <div class="d-flex align-items-center mb-4" style="gap: 1rem;">
    <span class="avatar-circle" style="width: 56px; height: 56px; font-size: 1.4rem;">{{ iniciales }}</span>
    <div>
      <div class="font-weight-bold" style="font-size: 1.1rem;">{{ usuario.nombre }}</div>
      <span class="badge badge-info">{{ rolLabel[usuario.rol] }}</span>
    </div>
  </div>

  <form [formGroup]="form" novalidate>
    <div class="form-group">
      <label for="nombre">Nombre *</label>
      <input id="nombre" type="text" class="form-control" formControlName="nombre"
             [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched" />
      <div class="invalid-feedback d-block" *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label>Usuario</label>
      <input type="text" class="form-control" [value]="usuario.username" disabled />
    </div>

    <div class="form-group">
      <label for="email">Correo</label>
      <input id="email" type="email" class="form-control" formControlName="email"
             placeholder="para recibir el resumen diario de alertas"
             [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched" />
      <div class="invalid-feedback d-block" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
        Ingresa un correo válido.
      </div>
    </div>

    <div class="form-group mb-4">
      <label>Rol</label>
      <input type="text" class="form-control" [value]="rolLabel[usuario.rol]" disabled />
    </div>

    <button type="button" class="btn btn-brand" [disabled]="guardando" (click)="guardar()">
      {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
    </button>
    <a routerLink="/cambiar-password" class="btn btn-outline-secondary ml-2">
      <i class="fa fa-key mr-1"></i> Cambiar contraseña
    </a>
  </form>
</div>
