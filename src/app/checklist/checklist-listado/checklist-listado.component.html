<div class="mb-3">
  <h2 class="mb-0">Checklist de mantenimiento</h2>
  <p class="text-muted-soft mb-0">Ítems de revisión por categoría de equipo, usados al registrar un servicio</p>
</div>

<div class="empty-state surface-card" *ngIf="cargando">
  <i class="fa fa-spinner fa-spin" style="font-size: 2rem;"></i>
</div>

<div class="surface-card p-4 mb-3" *ngFor="let categoria of categorias">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <h5 class="mb-0">{{ categoria.nombre }}</h5>
    <button class="btn btn-sm btn-outline-secondary" (click)="nuevoItem(categoria.id)">
      <i class="fa fa-plus mr-1"></i> Agregar ítem
    </button>
  </div>

  <div class="table-responsive" *ngIf="itemsPorCategoria(categoria.id).length > 0; else sinItems">
    <table class="table table-app mb-0">
      <thead>
        <tr>
          <th style="width: 60px;">Orden</th>
          <th>Ítem</th>
          <th>Activo</th>
          <th class="text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of itemsPorCategoria(categoria.id)">
          <td>{{ item.orden }}</td>
          <td>{{ item.nombre }}</td>
          <td>
            <span class="badge" [class.badge-success]="item.activo" [class.badge-secondary]="!item.activo">
              {{ item.activo ? 'Sí' : 'No' }}
            </span>
          </td>
          <td class="text-right">
            <div class="table-actions">
              <button class="table-action-btn" (click)="editarItem(item)" title="Editar">
                <i class="fa fa-pen"></i>
              </button>
              <button class="table-action-btn table-action-danger" *ngIf="esAdmin" (click)="eliminarItem(item)" title="Eliminar">
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #sinItems>
    <p class="text-muted-soft mb-0" style="font-size: .88rem;">Sin ítems configurados para esta categoría todavía.</p>
  </ng-template>
</div>
